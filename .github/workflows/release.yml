name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.repository == 'gatework/vxlan'
    runs-on: ubuntu-latest
    environment: release
    env:
      GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "4.0.6"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gem-${{ github.sha }}
          path: pkg
      - name: Validate the release tag and exact CI artifact
        run: |
          test "$GITHUB_REF_TYPE" = tag
          git merge-base --is-ancestor HEAD origin/main
          ruby script/release.rb --check
      - name: Configure RubyGems Trusted Publishing when no API key is configured
        if: env.GEM_HOST_API_KEY == ''
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a
      - name: Publish and verify RubyGems bytes
        run: ruby script/release.rb --push
      - name: Publish GitHub Release and verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ruby script/release.rb --github
