hostname LEF-LAB-01
feature bgp
feature ospf
feature vpc
feature interface-vlan
feature vn-segment-vlan-based
feature nv overlay
nv overlay evpn
vpc domain 7
  peer-switch
  peer-gateway
  layer3 peer-router
  peer-keepalive destination 192.0.2.12 source 192.0.2.11 vrf management
  virtual peer-link destination 192.0.2.22 source 192.0.2.21
interface port-channel1
  vpc peer-link
interface port-channel10
  vpc 10
interface Ethernet1/1
  ip address 10.0.0.1/31
  ip router ospf UNDERLAY area 0.0.0.0
interface Ethernet1/2
  vrf member BLUE
  ip address 10.0.0.5/31
  ip router ospf UNDERLAY area 0.0.0.1
interface Loopback0
  ip address 192.0.2.11/32
  ip router ospf UNDERLAY area 0.0.0.0
interface Loopback1
  ip address 192.0.2.21/32
router ospf UNDERLAY
  router-id 192.0.2.11
  vrf BLUE
    router-id 192.0.2.111
vlan 110
  vn-segment 10110
vlan 120
  vn-segment 10120
vlan 500
  vn-segment 50000
vrf context production
  vni 50000
  rd 65000:50000
  address-family ipv4 unicast
    route-target both auto evpn
vrf context green
  vni 60000
  rd auto
  address-family ipv4 unicast
    route-target import 65000:60000
interface Vlan110
  vrf member production
  ip address 10.110.0.1/24
  fabric forwarding mode anycast-gateway
interface nve1
  host-reachability protocol bgp
  source-interface Loopback1
  member vni 10110
    ingress-replication protocol bgp
    suppress-arp
  member vni 10120
    mcast-group 239.1.1.20
    no suppress-arp
  member vni 10200
    ingress-replication protocol bgp
  member vni 50000 associate-vrf
evpn
  vni 10110 l2
    rd auto
    route-target both auto
  vni 10300 l2
    rd 65000:10300
    route-target both 65000:10300
router bgp 65000
  router-id 192.0.2.11
  template peer SPINES
    remote-as 65000
    update-source Loopback0
    bfd
    address-family l2vpn evpn
      send-community extended
  neighbor 192.0.2.1
    inherit peer SPINES
  neighbor 192.0.2.0/24
    inherit peer SPINES
    no bfd
    address-family l2vpn evpn
      route-reflector-client
  neighbor 192.0.2.9
    remote-as external
    address-family ipv4 unicast
  vrf BLUE
    neighbor 192.0.2.1
      inherit peer SPINES
      no bfd
      address-family l2vpn evpn
        no route-reflector-client
end
