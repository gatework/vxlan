hostname LEF-POLICY-01
feature ospf
feature bgp
feature nv overlay
feature bgp
ip prefix-list SHARED seq 20 deny 0.0.0.0/0 le 32
ip prefix-list SHARED seq 5 permit 10.10.0.0/16 ge 24 le 28
ip prefix-list STAGED seq 5 permit 192.0.2.0/24
ip prefix-list UNUSED seq 5 permit 198.51.100.0/24
route-map EXPORT permit 10
  match ip address prefix-list SHARED SHARED
route-map EXPORT deny 20
  match ip address prefix-list SHARED
route-map PREPARED permit 5
  match ip address prefix-list SHARED STAGED
route-map RETAIN permit 10
  match ip address prefix-list SHARED
router bgp 4200000000
  address-family ipv4 unicast
    redistribute direct route-map EXPORT
  address-family l2vpn evpn
    retain route-target route-map RETAIN
  vrf BLUE
    address-family ipv4 unicast
      redistribute ospf UNDERLAY route-map EXPORT
  vrf GREEN
    address-family ipv4 unicast
      redistribute static route-map EXPORT
router ospf UNDERLAY
  redistribute bgp 4200000000 route-map EXPORT
  vrf BLUE
    redistribute direct route-map EXPORT
end
